name: Native PostgreSQL storage

on:
  pull_request:
    paths:
      - 'app/**'
      - 'ops/**'
      - 'requirements.txt'
      - '.github/workflows/native-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: app
      LEDGERLOOPS_TEST_POSTGRES_DSN: postgresql://ledgerloops_ci:actor-test-only@localhost:5432/ledgerloops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Create an ordinary test owner that cannot bypass RLS
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres:postgres-test-only@localhost:5432/postgres', autocommit=True) as db:
              db.execute("CREATE ROLE ledgerloops_ci LOGIN PASSWORD 'actor-test-only' NOSUPERUSER NOBYPASSRLS")
              db.execute('CREATE DATABASE ledgerloops_test OWNER ledgerloops_ci')
          PY
      - name: App, storage, isolation and migration regressions
        run: python -m unittest discover -s app -p 'test_*.py' -q
      - name: Deployment tooling regressions
        run: python -m unittest discover -s ops -p 'test_*.py' -q
