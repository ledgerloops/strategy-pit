<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LedgerLoops · product wireframes</title><style>
:root{font-family:system-ui,sans-serif;color:#202620;background:#eeeee7;line-height:1.5}*{box-sizing:border-box}body{margin:0}header{padding:18px 5%;border-bottom:2px solid;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}a{color:inherit;text-underline-offset:4px}main{display:grid;grid-template-columns:220px minmax(0,720px);gap:40px;max-width:1060px;margin:30px auto;padding:0 24px}nav a{display:block;padding:9px 0}nav a[aria-current=page]{font-weight:bold}h1{font-size:2rem;line-height:1.15}h2{font-size:1.15rem}.card{border:1px solid;padding:20px;margin:16px 0;background:#fafaf5}.muted{color:#545b54}.tag{font:12px monospace;border:1px solid;padding:4px 8px;display:inline-block}.row{display:flex;justify-content:space-between;gap:16px;margin:14px 0}.big{font-size:2rem}button,.button{font:inherit;display:inline-block;border:1px solid;padding:11px 16px;background:#243b2b;color:white;text-decoration:none;cursor:pointer;margin:4px 6px 4px 0}button.secondary,.button.secondary{background:transparent;color:inherit}button:disabled{opacity:.5;cursor:not-allowed}label{display:block;margin:14px 0}input,select{font:inherit;padding:10px;width:100%;border:1px solid;background:white}input[type=checkbox]{width:auto}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px 4px;border-bottom:1px solid #b4b9b1}aside{border-left:3px solid;padding:12px 16px;margin-top:25px;font-size:.9rem}footer{padding:24px 5%;font-size:.85rem}#notice{padding:12px;background:#dfe9d9}#notice:empty{display:none}:focus-visible{outline:3px solid #8b541c;outline-offset:4px}@media(max-width:650px){main{display:block;padding:0 16px;margin:16px auto}nav{display:flex;gap:16px;overflow:auto;margin-bottom:24px}nav a{white-space:nowrap}h1{font-size:1.7rem}.card{padding:16px}header{padding:16px}.row{flex-wrap:wrap}}
</style></head><body><header><strong>LedgerLoops / sketchbook</strong><span class="tag">FICTIONAL DATA · NO LIVE SETTLEMENT</span></header><main><nav aria-label="Prototype screens"><a href="#welcome">01 / Join</a><a href="#home">02 / Overview</a><a href="#peers">03 / Peers</a><a href="#import">04 / Import</a><a href="#proposal">05 / Review</a><a href="#pending">06 / Pending</a><a href="#receipt">07 / Receipt</a><a href="#settings">08 / Your node</a></nav><div><div id="notice" role="status"></div><section id="screen" aria-labelledby="title"></section></div></main><footer>Low-fidelity interaction study. No accounts, keys, uploads or network calls. Refresh resets choices. <a href="../README.md">Product specifications</a></footer><script>
const screen=document.querySelector('#screen'),notice=document.querySelector('#notice');
let paused=false,host='Community hosting',scenario='ready';
const intro=(title,body)=>`<h1 id="title" tabindex="-1">${title}</h1><p class="muted">${body}</p>`;
const annotation=t=>`<aside><strong>Design note</strong><br>${t}</aside>`;
const changes=`<table><caption>Your balances · community units (CU)</caption><thead><tr><th>Peer</th><th>Before</th><th>After</th></tr></thead><tbody><tr><td>You owe Bob</td><td>7 CU</td><td>4 CU</td></tr><tr><td>Doris owes you</td><td>5 CU</td><td>2 CU</td></tr></tbody></table><p>Your net position: <strong>−2 CU → −2 CU</strong></p>`;
const screens={
welcome:()=>intro('Clear debts. Keep your say.','Join your community and agree balances with people you know.')+`<div class="card"><h2>Choose where your node lives</h2><label>Hosting<select id="host"><option>Community hosting</option><option>Self-hosted node</option></select></label><p id="hosthelp">Your community operates an always-online node. Signing permissions are agreed separately.</p><label>Display name<input value="Alice" readonly aria-describedby="fictional"></label><small id="fictional">Example identity only. No account is created.</small><p>Next in the real app: verify an invitation, establish your signing identity, and set up recovery.</p><button data-action="join">Explore as Alice</button></div>`+annotation('PRD 01. Hosted convenience does not imply permission to sign. Actual identity and recovery setup are outside this clickable sketch.'),
home:()=>intro('Hello, Alice.','Your community · CU · example snapshot')+`<span class="tag">READ-ONLY ALPHA</span><div class="card"><div class="row"><span>You owe</span><strong class="big">7 CU</strong></div><div class="row"><span>You are owed</span><strong class="big">5 CU</strong></div><p>Net position <strong>−2 CU</strong></p><small>Agreed example balances. Proposals do not change these totals.</small></div><div class="card"><h2>A clearing proposal to review</h2><p>Reduce what you owe Bob by 3 CU, and what Doris owes you by 3 CU.</p><a class="button" href="#proposal">See before and after</a></div><a href="#import">Bring in your existing records</a>`,
peers:()=>intro('People you trade with','Only your direct relationships appear here.')+`<div class="card"><div class="row"><strong>Bob</strong><span>You owe 7 CU · agreed</span></div><div class="row"><strong>Doris</strong><span>Owes you 5 CU · agreed</span></div><div class="row"><strong>Charlie</strong><span>Invitation pending</span></div></div><button data-action="invite">Preview peer invitation</button><div id="invite"></div>`+annotation('PRD 02. Invitation verification and bilateral agreement precede clearing. A zero balance keeps history but closes fresh search until a new agreed transaction.'),
import:()=>intro('Review imported records','Preview a fictional CSV import. No files leave your device in this sketch.')+`<div class="card"><table><thead><tr><th>Record</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr><td>Bob / INV-014</td><td>7 CU</td><td>Already imported</td></tr><tr><td>Doris / INV-022</td><td>5 CU</td><td>Needs peer agreement</td></tr><tr><td>Charlie / INV-023</td><td>—</td><td>Missing unit</td></tr></tbody></table><p>Duplicate records are skipped. Fix the unit before proposing Charlie’s record.</p><button data-action="import">Preview reconciliation request</button></div>`+annotation('PRD 02. Imports never silently overwrite agreed balances. Original books remain authoritative in the alpha.'),
proposal:()=>intro('Clear 3 CU with your peers','No bank transfer is involved. Both your debt and your claim decrease by the same amount.')+`<label>Explore a review state<select id="scenario"><option value="ready">Ready for review</option><option value="stale">Balance changed</option><option value="offline">Your node is offline</option></select></label><div class="card">${changes}<p id="reviewstate"></p><label><input id="consent" type="checkbox"> I understand these changes and would accept this proposal.</label><button id="approve" data-action="approve" disabled>Record demo response</button><button class="secondary" data-action="decline">Decline demo proposal</button><p><small>Alpha response only. This does not reserve balances or settle debts.</small></p></div><a href="#pending">Explore a future live pending state →</a>`+annotation('PRD 03. The live approval must bind a specific proposal and balance revisions. A changed balance invalidates the old approval; an offline client cannot invent acceptance.'),
pending:()=>intro('Waiting for settlement evidence','Future live-pilot screen · illustrated state only')+`<span class="tag">OUTCOME UNCERTAIN</span><div class="card"><h2>3 CU is reserved</h2><p>A peer became unreachable after preparation. We are recovering the outcome. Your balance cannot be reused for another clearing until that outcome is known.</p><p>No completed receipt is available yet. Closing this app does not cancel the transaction.</p><button data-action="pause">${paused?'Resume new clearing':'Pause new clearing'}</button><button class="secondary" data-action="support">Get recovery details</button></div><a href="#receipt">Explore a separate completed example →</a>`+annotation('PRD 04. Navigation to a completed example simulates no protocol transition. Timeout alone cannot release an uncertain reservation.'),
receipt:()=>intro('Example completed receipt','Future live-pilot screen · fictional, unsigned example')+`<span class="tag">DEMO RECEIPT · NOT VALID EVIDENCE</span><div class="card"><h2>Clearing example LL-DEMO-003</h2>${changes}<p>Participant: Alice<br>Unit: CU<br>Evidence: simulated only; no signatures verified</p><button data-action="export">Download example JSON</button></div>`+annotation('PRD 04. Real completion needs verified settlement evidence and reconciled local records. Export only your own relevant entries; preserve original invoice history.'),
settings:()=>intro('Your node. Your permissions.','Hosting keeps messages moving while your phone is asleep.')+`<div class="card"><div class="row"><strong>Hosting</strong><span id="chosenhost"></span></div><div class="row"><strong>Approval policy</strong><span>Ask me each time</span></div><p>Automatic clearing and Headroom are unavailable in this alpha.</p><button data-action="pause">${paused?'Resume new clearing':'Pause new clearing'}</button><p>Pausing stops new work. Existing irrevocable settlements still need recovery.</p></div><div class="card"><h2>Recovery and leaving</h2><p>Before changing hosts, resolve pending work and verify a current backup. An old backup must not restore spent capacity.</p><button class="secondary" data-action="recovery">Preview recovery checklist</button></div>`+annotation('PRDs 01 and 05. This sketch changes no real permissions or keys. Hosting migration and recovery need protocol support before a live launch.')
};
function render(){const key=location.hash.slice(1)||'welcome';screen.innerHTML=(screens[key]||screens.welcome)();notice.textContent='';document.querySelectorAll('nav a').forEach(a=>{if(a.hash==='#'+key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(key==='settings')document.querySelector('#chosenhost').textContent=host;if(key==='welcome'){document.querySelector('#host').value=host;document.querySelector('#host').onchange=e=>{host=e.target.value;document.querySelector('#hosthelp').textContent=host==='Self-hosted node'?'You operate the node, backups and updates. The real app will verify the endpoint and its identity.':'Your community operates an always-online node. Signing permissions are agreed separately.'}}if(key==='proposal'){document.querySelector('#scenario').value=scenario;updateReview();document.querySelector('#scenario').onchange=e=>{scenario=e.target.value;document.querySelector('#consent').checked=false;updateReview()};document.querySelector('#consent').onchange=updateReview}document.querySelector('#title').focus()}
function updateReview(){const ready=scenario==='ready';document.querySelector('#reviewstate').textContent=ready?'Example proposal P-003 · Bob revision 4 · Doris revision 8':scenario==='stale'?'This proposal is out of date. Request a new proposal before responding.':'Your node is offline. Reconnect and refresh before responding.';document.querySelector('#consent').disabled=!ready;document.querySelector('#approve').disabled=!ready||!document.querySelector('#consent').checked}
document.addEventListener('click',e=>{const action=e.target.dataset.action;if(!action)return;if(action==='join'){location.hash='home';return}if(action==='invite'){document.querySelector('#invite').innerHTML='<div class="card"><h2>Invitation preview</h2><p>Invite Charlie · community CU · identity confirmation required.</p><p>Demo code: LL-EXAMPLE. This is not a usable invitation.</p></div>';return}if(action==='pause'){paused=!paused;render();notice.textContent=paused?'Demo: new clearing paused. Existing pending work remains.':'Demo: new clearing resumed.';return}if(action==='export'){const data={demo:true,valid_settlement_evidence:false,id:'LL-DEMO-003',unit:'CU',participant:'Alice',balances:[{peer:'Bob',before:-7,after:-4},{peer:'Doris',before:5,after:2}],net_before:-2,net_after:-2};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ledgerloops-demo-receipt.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice.textContent='Downloaded fictional, unsigned example receipt.';return}const messages={approve:'Demo response recorded: would accept. No balances changed.',decline:'Demo response recorded: declined. No balances changed.',import:'Preview: Doris would receive a request to agree INV-022. Nothing was sent.',support:'Recovery detail: LL-DEMO-003, awaiting outcome evidence. Share only with your chosen support provider.',recovery:'Checklist: verify current backup, confirm recovery authority, resolve pending work, test restore, then migrate.'};notice.textContent=messages[action]||''});window.addEventListener('hashchange',render);render();
</script></body></html>
